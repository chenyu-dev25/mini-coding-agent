[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mini-coding-agent-ollama"
version = "0.1.0"
description = "Minimal standalone coding agent backed by Ollama"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0",
    "pytest>=9.0.2",
    "rich>=13.7",
]

[project.scripts]
mini-coding-agent = "app:main"

[dependency-groups]
dev = [
  "pytest>=8.3.5",
  "ruff>=0.4.4",
]

[tool.setuptools]
py-modules = ["mini_coding_agent", "app", "trace_renderer", "markdown_console"]

[tool.setuptools.packages.find]
include = ["executor", "models", "router", "skills", "tools", "trace"]
